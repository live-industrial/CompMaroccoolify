name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - run: node --check server.js && node --check pro.js && node --check public/app.js && node --check public/pro.js
      - run: npm test
      - run: docker build -t comptabilite-maroc-pro:ci .
